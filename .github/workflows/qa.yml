name: antitrust dependency-stack QA
run-name: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') && format('release-certification-{0}', github.sha) || github.event_name == 'workflow_dispatch' && format('certification-{0}-{1}-{2}-{3}-{4}', inputs.release_certification, inputs.antitrust_release_sha, inputs.coordination_release_sha, inputs.trade_release_sha, inputs.run_stan_tests) || github.event_name }}

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_certification:
        description: "Require explicit full SHAs for the source dependency stack"
        required: false
        default: false
        type: boolean
      antitrust_ref:
        description: "antitrust development bootstrap ref (ignored for certification)"
        required: false
        default: "master"
        type: string
      antitrust_release_sha:
        description: "Full 40-character antitrust candidate SHA"
        required: false
        type: string
      coordination_ref:
        description: "coordination development bootstrap ref (ignored for certification)"
        required: false
        default: "main"
        type: string
      coordination_release_sha:
        description: "Full 40-character coordination candidate SHA"
        required: false
        type: string
      trade_ref:
        description: "trade development bootstrap ref (ignored for certification)"
        required: false
        default: "master"
        type: string
      trade_release_sha:
        description: "Full 40-character trade candidate SHA"
        required: false
        type: string
      run_stan_tests:
        description: "Run the opt-in CmdStan sampling/parity tier"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  R_VERSION: "4.6.1"
  RELEASE_CERTIFICATION: ${{ inputs.release_certification && 'true' || 'false' }}
  RELEASE_BRANCH_BUILD: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release/') || startsWith(github.base_ref, 'release/'))) }}
  RELEASE_PIN_BUILD: ${{ (inputs.release_certification == true) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release/') || startsWith(github.base_ref, 'release/'))) }}
  ANTITRUST_REPO: "luciu5/antitrust"
  ANTITRUST_REQUESTED_REF: ${{ inputs.release_certification && inputs.antitrust_release_sha || inputs.antitrust_ref || 'master' }}
  COORDINATION_REPO: "luciu5/coordination"
  COORDINATION_REQUESTED_REF: ${{ inputs.release_certification && inputs.coordination_release_sha || inputs.coordination_ref || 'main' }}
  TRADE_REPO: "luciu5/trade"
  TRADE_REQUESTED_REF: ${{ inputs.release_certification && inputs.trade_release_sha || inputs.trade_ref || 'master' }}
  CMDSTANR_SHA: "55342f4f6c9300f9a47046f107b4db9b5e468aa6"
  _R_CHECK_FORCE_SUGGESTS_: "false"
  ANTITRUSTBAYES_RUN_STAN_TESTS: "false"

jobs:
  fast:
    name: optional-free QA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out antitrustBayes
        uses: actions/checkout@v4

      - name: Set up R ${{ env.R_VERSION }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      - name: Select structural dependency refs
        id: dependency-refs
        env:
          ANTITRUST_RELEASE_SHA: ${{ inputs.antitrust_release_sha }}
          COORDINATION_RELEASE_SHA: ${{ inputs.coordination_release_sha }}
          TRADE_RELEASE_SHA: ${{ inputs.trade_release_sha }}
          ANTITRUST_DEVELOPMENT_REF: ${{ inputs.antitrust_ref || 'master' }}
          COORDINATION_DEVELOPMENT_REF: ${{ inputs.coordination_ref || 'main' }}
          TRADE_DEVELOPMENT_REF: ${{ inputs.trade_ref || 'master' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CERTIFICATION" == true ]]; then
            antitrust_ref="$ANTITRUST_RELEASE_SHA"
            coordination_ref="$COORDINATION_RELEASE_SHA"
            trade_ref="$TRADE_RELEASE_SHA"
          elif [[ "$RELEASE_BRANCH_BUILD" == true ]]; then
            python3 - <<'PY' > "$RUNNER_TEMP/release-dependency-refs.txt"
          import json
          import re
          from pathlib import Path

          pins = json.loads(Path("ci/release-dependencies.json").read_text())
          required = {"antitrust", "coordination", "trade"}
          if not isinstance(pins, dict) or set(pins) != required:
              raise SystemExit("ci/release-dependencies.json must contain exactly antitrust, coordination, and trade")
          for name in ("antitrust", "coordination", "trade"):
              sha = pins[name]
              if not isinstance(sha, str) or not re.fullmatch(r"[0-9a-fA-F]{40}", sha):
                  raise SystemExit(f"ci/release-dependencies.json must pin {name} to a full 40-character SHA")
              print(f"{name}_ref={sha.lower()}")
          PY
            cat "$RUNNER_TEMP/release-dependency-refs.txt" >> "$GITHUB_OUTPUT"
            exit 0
          else
            antitrust_ref="$ANTITRUST_REQUESTED_REF"
            coordination_ref="$COORDINATION_REQUESTED_REF"
            trade_ref="$TRADE_REQUESTED_REF"
          fi

          for item in "antitrust:$antitrust_ref" "coordination:$coordination_ref" "trade:$trade_ref"; do
            name="${item%%:*}"
            ref="${item#*:}"
            if [[ "$RELEASE_CERTIFICATION" == true ]]; then
              if [[ ! "$ref" =~ ^[[:xdigit:]]{40}$ ]]; then
                echo "Release certification requires an explicit full 40-character ${name} SHA." >&2
                exit 1
              fi
            elif [[ ! "$ref" =~ ^[[:alnum:]_./-]+$ ]]; then
              echo "Invalid ${name} development ref." >&2
              exit 1
            fi
            printf '%s_ref=%s\n' "$name" "$ref" >> "$GITHUB_OUTPUT"
          done

      - name: Validate full SHAs for release-pin runs
        env:
          ANTITRUST_SELECTED_REF: ${{ steps.dependency-refs.outputs.antitrust_ref }}
          COORDINATION_SELECTED_REF: ${{ steps.dependency-refs.outputs.coordination_ref }}
          TRADE_SELECTED_REF: ${{ steps.dependency-refs.outputs.trade_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_PIN_BUILD" == true ]]; then
            for item in "antitrust:$ANTITRUST_SELECTED_REF" "coordination:$COORDINATION_SELECTED_REF" "trade:$TRADE_SELECTED_REF"; do
              name="${item%%:*}"
              sha="${item#*:}"
              if [[ ! "$sha" =~ ^[[:xdigit:]]{40}$ ]]; then
                echo "Release pinning requires a full 40-character ${name} SHA." >&2
                exit 1
              fi
            done
          fi

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      # Explicit dependencies keep nutpieR/bridgestan out of the default tier.
      # This explicit list contains third-party packages only. Structural
      # packages are installed below from verified checkouts so coordination's
      # Remotes field cannot replace the selected exact pins.
      - name: Install ordinary dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: false
          install-pandoc: false
          dependencies: 'c("Depends", "Imports", "LinkingTo")'
          packages: |
            any::BB
            any::numDeriv
            any::nleqslv
            any::SQUAREM
            any::bridgesampling
            any::digest
            any::posterior
            any::loo
            github::stan-dev/cmdstanr@${{ env.CMDSTANR_SHA }}
            any::testthat
            any::pkgload
            any::knitr
            any::rmarkdown
            any::ggplot2
            any::bayesplot
            any::rcmdcheck

      - name: Install and record verified structural dependencies
        env:
          ANTITRUST_SELECTED_REF: ${{ steps.dependency-refs.outputs.antitrust_ref }}
          COORDINATION_SELECTED_REF: ${{ steps.dependency-refs.outputs.coordination_ref }}
          TRADE_SELECTED_REF: ${{ steps.dependency-refs.outputs.trade_ref }}
        shell: bash
        run: |
          set -euo pipefail
          printf '## Verified dependency sources\n' >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- antitrustBayes: `%s`\n' "$(git rev-parse HEAD)" >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- release_pin_build: `%s`\n' "$RELEASE_PIN_BUILD" >> "${GITHUB_STEP_SUMMARY}"
          printf 'release_pin_build=%s\nantitrustBayes_resolved_sha=%s\n' \
            "$RELEASE_PIN_BUILD" "$(git rev-parse HEAD)" >> "$RUNNER_TEMP/dependency-shas.txt"
          for dependency in antitrust coordination trade; do
            if [[ "${dependency}" == antitrust ]]; then
              repository="${ANTITRUST_REPO}"
              requested_ref="${ANTITRUST_SELECTED_REF}"
            elif [[ "${dependency}" == coordination ]]; then
              repository="${COORDINATION_REPO}"
              requested_ref="${COORDINATION_SELECTED_REF}"
            else
              repository="${TRADE_REPO}"
              requested_ref="${TRADE_SELECTED_REF}"
            fi
            if [[ "$RELEASE_PIN_BUILD" == true ]]; then
              expected_sha="${requested_ref,,}"
            else
              expected_sha="$(git ls-remote "https://github.com/${repository}.git" "$requested_ref" | awk 'NR == 1 { print $1 }')"
              if [[ -z "$expected_sha" && "$requested_ref" != refs/* ]]; then
                expected_sha="$(git ls-remote "https://github.com/${repository}.git" "refs/heads/${requested_ref}" | awk 'NR == 1 { print $1 }')"
              fi
              if [[ -z "$expected_sha" && "$requested_ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
                expected_sha="$requested_ref"
              fi
            fi
            if [[ ! "$expected_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Could not resolve ${dependency} ref '$requested_ref' to a commit SHA" >&2
              exit 1
            fi
            checkout_dir="$(mktemp -d "$RUNNER_TEMP/dependency-${dependency}.XXXXXX")"
            git -C "${checkout_dir}" init --quiet
            git -C "${checkout_dir}" fetch --depth 1 "https://github.com/${repository}.git" "${expected_sha}"
            git -C "${checkout_dir}" checkout --detach FETCH_HEAD
            test "$(git -C "${checkout_dir}" rev-parse HEAD)" = "${expected_sha}"
            R CMD INSTALL --no-multiarch "${checkout_dir}"
            Rscript --vanilla - "${checkout_dir}" "${dependency}" "$RELEASE_PIN_BUILD" \
              "$ANTITRUST_SELECTED_REF" "$COORDINATION_SELECTED_REF" <<'RSCRIPT'
          args <- commandArgs(trailingOnly = TRUE)
          source_dcf <- read.dcf(file.path(args[[1L]], "DESCRIPTION"))[1L, ]
          expected <- unname(source_dcf[["Version"]])
          actual <- as.character(utils::packageVersion(args[[2L]]))
          stopifnot(identical(actual, expected), requireNamespace(args[[2L]], quietly = TRUE))
          normalize_remotes <- function(x) {
            if (is.null(x) || !length(x) || is.na(x[[1L]]) || !nzchar(x[[1L]])) {
              return(character())
            }
            trimws(strsplit(as.character(x[[1L]]), ",", fixed = TRUE)[[1L]])
          }
          if (identical(args[[3L]], "true")) {
            antitrust_sha <- tolower(args[[4L]])
            coordination_sha <- tolower(args[[5L]])
            expected_remotes <- switch(args[[2L]],
              antitrust = character(),
              coordination = paste0("luciu5/antitrust@", antitrust_sha),
              trade = c(paste0("luciu5/antitrust@", antitrust_sha),
                        paste0("luciu5/coordination@", coordination_sha)),
              stop("Unexpected structural dependency: ", args[[2L]])
            )
            source_remotes <- normalize_remotes(source_dcf[["Remotes"]])
            installed_remotes <- normalize_remotes(utils::packageDescription(args[[2L]])[["Remotes"]])
            stopifnot(identical(source_remotes, expected_remotes),
                      identical(installed_remotes, expected_remotes))
          }
          cat(args[[2L]], actual, find.package(args[[2L]]), "\n")
          RSCRIPT
            printf -- '- %s: requested `%s`, resolved `%s`\n' "${dependency}" "$requested_ref" "${expected_sha}" >> "${GITHUB_STEP_SUMMARY}"
            printf '%s_requested_ref=%s\n%s_resolved_sha=%s\n' \
              "$dependency" "$requested_ref" "$dependency" "$expected_sha" >> "$RUNNER_TEMP/dependency-shas.txt"
          done

      - name: Verify optional-free installation and CmdStanR pin
        shell: Rscript {0}
        run: |
          stopifnot(!requireNamespace("nutpieR", quietly = TRUE),
                    !requireNamespace("bridgestan", quietly = TRUE),
                    utils::packageVersion("antitrust") >= "0.99.43",
                    utils::packageVersion("coordination") >= "0.1.0",
                    utils::packageVersion("trade") >= "0.9.0",
                    identical(utils::packageDescription("cmdstanr")$RemoteSha,
                              Sys.getenv("CMDSTANR_SHA")))
          for (package in c("antitrust", "coordination", "trade", "cmdstanr", "posterior")) {
            cat(package, as.character(utils::packageVersion(package)), find.package(package), "\n")
          }

      - name: Build and check without optional native backends
        shell: bash
        run: |
          set -euo pipefail
          R CMD build --no-manual .
          package_tarball="$(find . -maxdepth 1 -type f -name 'antitrustBayes_*.tar.gz' -print -quit)"
          test -n "${package_tarball}"
          R CMD check --no-manual "${package_tarball}"

      - name: Run source backend and policy-runner regressions
        shell: Rscript {0}
        run: |
          stopifnot(requireNamespace("trade", quietly = TRUE))
          testthat::test_local(
            filter = "sampler-backend|nutpie|backend-policy-equivalence",
            reporter = "summary"
          )

      - name: Preserve package-check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optional-free-check
          path: |
            antitrustBayes.Rcheck
            ${{ runner.temp }}/dependency-shas.txt
          if-no-files-found: ignore

  stan:
    name: CmdStan smoke tests
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_stan_tests == true)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out antitrustBayes
        uses: actions/checkout@v4

      - name: Set up R ${{ env.R_VERSION }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      - name: Select structural dependency refs
        id: dependency-refs
        env:
          ANTITRUST_RELEASE_SHA: ${{ inputs.antitrust_release_sha }}
          COORDINATION_RELEASE_SHA: ${{ inputs.coordination_release_sha }}
          TRADE_RELEASE_SHA: ${{ inputs.trade_release_sha }}
          ANTITRUST_DEVELOPMENT_REF: ${{ inputs.antitrust_ref || 'master' }}
          COORDINATION_DEVELOPMENT_REF: ${{ inputs.coordination_ref || 'main' }}
          TRADE_DEVELOPMENT_REF: ${{ inputs.trade_ref || 'master' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CERTIFICATION" == true ]]; then
            antitrust_ref="$ANTITRUST_RELEASE_SHA"
            coordination_ref="$COORDINATION_RELEASE_SHA"
            trade_ref="$TRADE_RELEASE_SHA"
          elif [[ "$RELEASE_BRANCH_BUILD" == true ]]; then
            python3 - <<'PY' > "$RUNNER_TEMP/release-dependency-refs.txt"
          import json
          import re
          from pathlib import Path

          pins = json.loads(Path("ci/release-dependencies.json").read_text())
          required = {"antitrust", "coordination", "trade"}
          if not isinstance(pins, dict) or set(pins) != required:
              raise SystemExit("ci/release-dependencies.json must contain exactly antitrust, coordination, and trade")
          for name in ("antitrust", "coordination", "trade"):
              sha = pins[name]
              if not isinstance(sha, str) or not re.fullmatch(r"[0-9a-fA-F]{40}", sha):
                  raise SystemExit(f"ci/release-dependencies.json must pin {name} to a full 40-character SHA")
              print(f"{name}_ref={sha.lower()}")
          PY
            cat "$RUNNER_TEMP/release-dependency-refs.txt" >> "$GITHUB_OUTPUT"
            exit 0
          else
            antitrust_ref="$ANTITRUST_REQUESTED_REF"
            coordination_ref="$COORDINATION_REQUESTED_REF"
            trade_ref="$TRADE_REQUESTED_REF"
          fi

          for item in "antitrust:$antitrust_ref" "coordination:$coordination_ref" "trade:$trade_ref"; do
            name="${item%%:*}"
            ref="${item#*:}"
            if [[ "$RELEASE_CERTIFICATION" == true ]]; then
              if [[ ! "$ref" =~ ^[[:xdigit:]]{40}$ ]]; then
                echo "Release certification requires an explicit full 40-character ${name} SHA." >&2
                exit 1
              fi
            elif [[ ! "$ref" =~ ^[[:alnum:]_./-]+$ ]]; then
              echo "Invalid ${name} development ref." >&2
              exit 1
            fi
            printf '%s_ref=%s\n' "$name" "$ref" >> "$GITHUB_OUTPUT"
          done

      - name: Validate full SHAs for release-pin runs
        env:
          ANTITRUST_SELECTED_REF: ${{ steps.dependency-refs.outputs.antitrust_ref }}
          COORDINATION_SELECTED_REF: ${{ steps.dependency-refs.outputs.coordination_ref }}
          TRADE_SELECTED_REF: ${{ steps.dependency-refs.outputs.trade_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_PIN_BUILD" == true ]]; then
            for item in "antitrust:$ANTITRUST_SELECTED_REF" "coordination:$COORDINATION_SELECTED_REF" "trade:$TRADE_SELECTED_REF"; do
              name="${item%%:*}"
              sha="${item#*:}"
              if [[ ! "$sha" =~ ^[[:xdigit:]]{40}$ ]]; then
                echo "Release pinning requires a full 40-character ${name} SHA." >&2
                exit 1
              fi
            done
          fi

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      # Keep this explicit list limited to third-party packages; internal
      # structural packages come from the verified SHAs selected above.
      - name: Install ordinary dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: false
          install-pandoc: false
          dependencies: 'c("Depends", "Imports", "LinkingTo")'
          packages: |
            any::BB
            any::numDeriv
            any::nleqslv
            any::SQUAREM
            any::bridgesampling
            any::digest
            any::posterior
            any::loo
            github::stan-dev/cmdstanr@${{ env.CMDSTANR_SHA }}
            any::testthat
            any::pkgload
            any::knitr
            any::rmarkdown
            any::ggplot2
            any::bayesplot
            any::rcmdcheck

      - name: Install and record verified structural dependencies
        env:
          ANTITRUST_SELECTED_REF: ${{ steps.dependency-refs.outputs.antitrust_ref }}
          COORDINATION_SELECTED_REF: ${{ steps.dependency-refs.outputs.coordination_ref }}
          TRADE_SELECTED_REF: ${{ steps.dependency-refs.outputs.trade_ref }}
        shell: bash
        run: |
          set -euo pipefail
          printf '## Verified dependency sources\n' >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- antitrustBayes: `%s`\n' "$(git rev-parse HEAD)" >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- release_pin_build: `%s`\n' "$RELEASE_PIN_BUILD" >> "${GITHUB_STEP_SUMMARY}"
          printf 'release_pin_build=%s\nantitrustBayes_resolved_sha=%s\n' \
            "$RELEASE_PIN_BUILD" "$(git rev-parse HEAD)" >> "$RUNNER_TEMP/dependency-shas.txt"
          for dependency in antitrust coordination trade; do
            if [[ "${dependency}" == antitrust ]]; then
              repository="${ANTITRUST_REPO}"
              requested_ref="${ANTITRUST_SELECTED_REF}"
            elif [[ "${dependency}" == coordination ]]; then
              repository="${COORDINATION_REPO}"
              requested_ref="${COORDINATION_SELECTED_REF}"
            else
              repository="${TRADE_REPO}"
              requested_ref="${TRADE_SELECTED_REF}"
            fi
            if [[ "$RELEASE_PIN_BUILD" == true ]]; then
              expected_sha="${requested_ref,,}"
            else
              expected_sha="$(git ls-remote "https://github.com/${repository}.git" "$requested_ref" | awk 'NR == 1 { print $1 }')"
              if [[ -z "$expected_sha" && "$requested_ref" != refs/* ]]; then
                expected_sha="$(git ls-remote "https://github.com/${repository}.git" "refs/heads/${requested_ref}" | awk 'NR == 1 { print $1 }')"
              fi
              if [[ -z "$expected_sha" && "$requested_ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
                expected_sha="$requested_ref"
              fi
            fi
            if [[ ! "$expected_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Could not resolve ${dependency} ref '$requested_ref' to a commit SHA" >&2
              exit 1
            fi
            checkout_dir="$(mktemp -d "$RUNNER_TEMP/dependency-${dependency}.XXXXXX")"
            git -C "${checkout_dir}" init --quiet
            git -C "${checkout_dir}" fetch --depth 1 "https://github.com/${repository}.git" "${expected_sha}"
            git -C "${checkout_dir}" checkout --detach FETCH_HEAD
            test "$(git -C "${checkout_dir}" rev-parse HEAD)" = "${expected_sha}"
            R CMD INSTALL --no-multiarch "${checkout_dir}"
            Rscript --vanilla - "${checkout_dir}" "${dependency}" "$RELEASE_PIN_BUILD" \
              "$ANTITRUST_SELECTED_REF" "$COORDINATION_SELECTED_REF" <<'RSCRIPT'
          args <- commandArgs(trailingOnly = TRUE)
          source_dcf <- read.dcf(file.path(args[[1L]], "DESCRIPTION"))[1L, ]
          expected <- unname(source_dcf[["Version"]])
          actual <- as.character(utils::packageVersion(args[[2L]]))
          stopifnot(identical(actual, expected), requireNamespace(args[[2L]], quietly = TRUE))
          normalize_remotes <- function(x) {
            if (is.null(x) || !length(x) || is.na(x[[1L]]) || !nzchar(x[[1L]])) {
              return(character())
            }
            trimws(strsplit(as.character(x[[1L]]), ",", fixed = TRUE)[[1L]])
          }
          if (identical(args[[3L]], "true")) {
            antitrust_sha <- tolower(args[[4L]])
            coordination_sha <- tolower(args[[5L]])
            expected_remotes <- switch(args[[2L]],
              antitrust = character(),
              coordination = paste0("luciu5/antitrust@", antitrust_sha),
              trade = c(paste0("luciu5/antitrust@", antitrust_sha),
                        paste0("luciu5/coordination@", coordination_sha)),
              stop("Unexpected structural dependency: ", args[[2L]])
            )
            source_remotes <- normalize_remotes(source_dcf[["Remotes"]])
            installed_remotes <- normalize_remotes(utils::packageDescription(args[[2L]])[["Remotes"]])
            stopifnot(identical(source_remotes, expected_remotes),
                      identical(installed_remotes, expected_remotes))
          }
          cat(args[[2L]], actual, find.package(args[[2L]]), "\n")
          RSCRIPT
            printf -- '- %s: requested `%s`, resolved `%s`\n' "${dependency}" "$requested_ref" "${expected_sha}" >> "${GITHUB_STEP_SUMMARY}"
            printf '%s_requested_ref=%s\n%s_resolved_sha=%s\n' \
              "$dependency" "$requested_ref" "$dependency" "$expected_sha" >> "$RUNNER_TEMP/dependency-shas.txt"
          done

      - name: Verify optional-free installation and CmdStanR pin
        shell: Rscript {0}
        run: |
          stopifnot(!requireNamespace("nutpieR", quietly = TRUE),
                    !requireNamespace("bridgestan", quietly = TRUE),
                    utils::packageVersion("antitrust") >= "0.99.43",
                    utils::packageVersion("coordination") >= "0.1.0",
                    utils::packageVersion("trade") >= "0.9.0",
                    identical(utils::packageDescription("cmdstanr")$RemoteSha,
                              Sys.getenv("CMDSTANR_SHA")))

      - name: Install the frozen CmdStan toolchain
        shell: Rscript {0}
        run: |
          cmdstanr::install_cmdstan(version = "2.39.0", cores = 2L, quiet = TRUE)
          stopifnot(as.character(cmdstanr::cmdstan_version()) == "2.39.0")
          cat("CmdStan", as.character(cmdstanr::cmdstan_version()), cmdstanr::cmdstan_path(), "\n")

      - name: Install current package
        run: R CMD INSTALL --no-multiarch .

      - name: Run targeted Logit/CES Stan, pooling, and dispatch tests
        env:
          ANTITRUSTBAYES_RUN_STAN_TESTS: "true"
        shell: Rscript {0}
        run: |
          library(testthat)
          stopifnot(as.character(cmdstanr::cmdstan_version()) == "2.39.0")
          testthat::test_dir(
            file.path("tests", "testthat"),
            filter = "rho-studentt|s0-information-ladder|s0-pooling|simulate-dispatch",
            reporter = "summary", package = "antitrustBayes",
            load_package = "installed"
          )

      - name: Preserve CmdStan dependency provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stan-dependency-provenance
          path: ${{ runner.temp }}/dependency-shas.txt
          if-no-files-found: ignore
