name: antitrust dependency-stack QA

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      antitrust_ref:
        description: "antitrust branch or commit SHA to install"
        required: true
        default: "103c2491607d7f164f5e4e00fc21d6ea79331138"
        type: string
      run_stan_tests:
        description: "Run the opt-in Stan sampling/parity tier"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  R_VERSION: "4.6.1"
  ANTITRUST_REPO: "luciu5/antitrust"
  ANTITRUST_REQUESTED_REF: ${{ inputs.antitrust_ref || '103c2491607d7f164f5e4e00fc21d6ea79331138' }}

jobs:
  fast:
    name: fast QA (antitrust ${{ inputs.antitrust_ref || '103c2491607d7f164f5e4e00fc21d6ea79331138' }})
    runs-on: ubuntu-latest
    env:
      QA_TIER: fast
    outputs:
      antitrust_requested_ref: ${{ steps.provenance.outputs.antitrust_requested_ref }}
      antitrust_sha: ${{ steps.provenance.outputs.antitrust_sha }}
      antitrustbayes_sha: ${{ steps.provenance.outputs.antitrustbayes_sha }}
    steps:
      - name: Check out antitrustBayes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R ${{ env.R_VERSION }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      - name: Resolve and record dependency provenance
        id: provenance
        run: |
          set -euo pipefail
          bayes_sha="$(git rev-parse HEAD)"
          requested_ref="${ANTITRUST_REQUESTED_REF}"
          antitrust_sha="$(git ls-remote "https://github.com/${ANTITRUST_REPO}.git" "${requested_ref}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "${antitrust_sha}" && "${requested_ref}" != refs/* ]]; then
            antitrust_sha="$(git ls-remote "https://github.com/${ANTITRUST_REPO}.git" "refs/heads/${requested_ref}" | awk 'NR == 1 { print $1 }')"
          fi
          if [[ -z "${antitrust_sha}" && "${requested_ref}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            antitrust_sha="${requested_ref}"
          fi
          if [[ ! "${antitrust_sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Could not resolve antitrust ref '${requested_ref}' to a commit SHA" >&2
            exit 1
          fi
          echo "antitrust_requested_ref=${requested_ref}" >> "${GITHUB_OUTPUT}"
          echo "antitrust_sha=${antitrust_sha}" >> "${GITHUB_OUTPUT}"
          echo "antitrustbayes_sha=${bayes_sha}" >> "${GITHUB_OUTPUT}"
          echo "ANTITRUST_SHA=${antitrust_sha}" >> "${GITHUB_ENV}"
          {
            echo "## Dependency provenance"
            echo "- tier: `${QA_TIER}`"
            echo "- requested antitrust ref: `${requested_ref}`"
            echo "- resolved antitrust SHA: `${antitrust_sha}`"
            echo "- antitrustBayes SHA: `${bayes_sha}`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install selected antitrust revision first
        shell: bash
        run: |
          set -euo pipefail
          checkout_dir="$(mktemp -d)"
          git clone --no-checkout "https://github.com/${ANTITRUST_REPO}.git" "${checkout_dir}"
          git -C "${checkout_dir}" fetch --depth 1 origin "${ANTITRUST_SHA}"
          git -C "${checkout_dir}" checkout --detach "${ANTITRUST_SHA}"
          checked_out_sha="$(git -C "${checkout_dir}" rev-parse HEAD)"
          if [[ "${checked_out_sha}" != "${ANTITRUST_SHA}" ]]; then
            echo "::error::Checked-out antitrust SHA ${checked_out_sha} does not match ${ANTITRUST_SHA}" >&2
            exit 1
          fi
          echo "ANTITRUST_CHECKOUT_DIR=${checkout_dir}" >> "${GITHUB_ENV}"
          Rscript --vanilla - "${checkout_dir}" <<'RSCRIPT'
          args <- commandArgs(trailingOnly = TRUE)
          desc <- read.dcf(file.path(args[[1]], "DESCRIPTION"))[1, ]
          imports <- desc[["Imports"]]
          if (!is.na(imports) && nzchar(imports)) {
              packages <- trimws(strsplit(imports, ",", fixed = TRUE)[[1]])
              packages <- sub("\\s*\\(.*$", "", packages)
              packages <- packages[nzchar(packages)]
              missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]
              if (length(missing)) {
                  install.packages(missing, repos = "https://cloud.r-project.org")
              }
          }
          RSCRIPT
          R CMD INSTALL --no-multiarch "${checkout_dir}"
          echo "antitrust installed from verified checkout SHA: ${checked_out_sha}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Install remaining package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: false
          extra-packages: any::rcmdcheck

      - name: Reassert selected antitrust revision after dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git -C "${ANTITRUST_CHECKOUT_DIR}" rev-parse HEAD)"
          if [[ "${checked_out_sha}" != "${ANTITRUST_SHA}" ]]; then
            echo "::error::Reasserted antitrust SHA ${checked_out_sha} does not match ${ANTITRUST_SHA}" >&2
            exit 1
          fi
          R CMD INSTALL --no-multiarch "${ANTITRUST_CHECKOUT_DIR}"

      - name: Verify selected antitrust remains installed
        run: |
          set -euo pipefail
          checked_out_sha="$(git -C "${ANTITRUST_CHECKOUT_DIR}" rev-parse HEAD)"
          test "${checked_out_sha}" = "${ANTITRUST_SHA}"
          Rscript -e 'stopifnot(packageVersion("antitrust") >= "0.99.38")'

      - name: Build package
        run: |
          set -euo pipefail
          R CMD build --no-manual .
          package_tarball="$(find . -maxdepth 1 -type f -name 'antitrustBayes_*.tar.gz' -print -quit)"
          test -n "${package_tarball}"
          echo "PACKAGE_TARBALL=${package_tarball}" >> "${GITHUB_ENV}"

      - name: R CMD check (Stan sampling tests opt out)
        env:
          ANTITRUSTBAYES_RUN_STAN_TESTS: "false"
        run: R CMD check --no-manual "${PACKAGE_TARBALL}"

      - name: Install built package for deterministic tests
        run: R CMD INSTALL --preclean "${PACKAGE_TARBALL}"

      - name: Run normal package test suite without MCMC
        env:
          ANTITRUSTBAYES_RUN_STAN_TESTS: "false"
        run: |
          Rscript - <<'RSCRIPT'
          library(testthat)
          library(antitrustBayes)
          testthat::test_dir(
            file.path("tests", "testthat"),
            reporter = "summary", package = "antitrustBayes",
            load_package = "installed"
          )
          RSCRIPT

  stan:
    name: Stan smoke tests (antitrust ${{ inputs.antitrust_ref || '103c2491607d7f164f5e4e00fc21d6ea79331138' }})
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_stan_tests == true)
    runs-on: ubuntu-latest
    env:
      QA_TIER: stan
    steps:
      - name: Check out antitrustBayes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R ${{ env.R_VERSION }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      - name: Resolve and record dependency provenance
        id: provenance
        run: |
          set -euo pipefail
          bayes_sha="$(git rev-parse HEAD)"
          requested_ref="${ANTITRUST_REQUESTED_REF}"
          antitrust_sha="$(git ls-remote "https://github.com/${ANTITRUST_REPO}.git" "${requested_ref}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "${antitrust_sha}" && "${requested_ref}" != refs/* ]]; then
            antitrust_sha="$(git ls-remote "https://github.com/${ANTITRUST_REPO}.git" "refs/heads/${requested_ref}" | awk 'NR == 1 { print $1 }')"
          fi
          if [[ -z "${antitrust_sha}" && "${requested_ref}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            antitrust_sha="${requested_ref}"
          fi
          if [[ ! "${antitrust_sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Could not resolve antitrust ref '${requested_ref}' to a commit SHA" >&2
            exit 1
          fi
          echo "ANTITRUST_SHA=${antitrust_sha}" >> "${GITHUB_ENV}"
          {
            echo "## Dependency provenance"
            echo "- tier: `${QA_TIER}`"
            echo "- requested antitrust ref: `${requested_ref}`"
            echo "- resolved antitrust SHA: `${antitrust_sha}`"
            echo "- antitrustBayes SHA: `${bayes_sha}`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install selected antitrust revision first
        shell: bash
        run: |
          set -euo pipefail
          checkout_dir="$(mktemp -d)"
          git clone --no-checkout "https://github.com/${ANTITRUST_REPO}.git" "${checkout_dir}"
          git -C "${checkout_dir}" fetch --depth 1 origin "${ANTITRUST_SHA}"
          git -C "${checkout_dir}" checkout --detach "${ANTITRUST_SHA}"
          checked_out_sha="$(git -C "${checkout_dir}" rev-parse HEAD)"
          if [[ "${checked_out_sha}" != "${ANTITRUST_SHA}" ]]; then
            echo "::error::Checked-out antitrust SHA ${checked_out_sha} does not match ${ANTITRUST_SHA}" >&2
            exit 1
          fi
          echo "ANTITRUST_CHECKOUT_DIR=${checkout_dir}" >> "${GITHUB_ENV}"
          Rscript --vanilla - "${checkout_dir}" <<'RSCRIPT'
          args <- commandArgs(trailingOnly = TRUE)
          desc <- read.dcf(file.path(args[[1]], "DESCRIPTION"))[1, ]
          imports <- desc[["Imports"]]
          if (!is.na(imports) && nzchar(imports)) {
              packages <- trimws(strsplit(imports, ",", fixed = TRUE)[[1]])
              packages <- sub("\\s*\\(.*$", "", packages)
              packages <- packages[nzchar(packages)]
              missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]
              if (length(missing)) {
                  install.packages(missing, repos = "https://cloud.r-project.org")
              }
          }
          RSCRIPT
          R CMD INSTALL --no-multiarch "${checkout_dir}"
          echo "antitrust installed from verified checkout SHA: ${checked_out_sha}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Install remaining package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: false
          extra-packages: any::rcmdcheck

      - name: Reassert selected antitrust revision after dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git -C "${ANTITRUST_CHECKOUT_DIR}" rev-parse HEAD)"
          if [[ "${checked_out_sha}" != "${ANTITRUST_SHA}" ]]; then
            echo "::error::Reasserted antitrust SHA ${checked_out_sha} does not match ${ANTITRUST_SHA}" >&2
            exit 1
          fi
          R CMD INSTALL --no-multiarch "${ANTITRUST_CHECKOUT_DIR}"

      - name: Verify selected antitrust remains installed
        run: |
          set -euo pipefail
          checked_out_sha="$(git -C "${ANTITRUST_CHECKOUT_DIR}" rev-parse HEAD)"
          test "${checked_out_sha}" = "${ANTITRUST_SHA}"
          Rscript -e 'stopifnot(packageVersion("antitrust") >= "0.99.38")'

      - name: Build package
        run: |
          set -euo pipefail
          R CMD build --no-manual .
          package_tarball="$(find . -maxdepth 1 -type f -name 'antitrustBayes_*.tar.gz' -print -quit)"
          test -n "${package_tarball}"
          echo "PACKAGE_TARBALL=${package_tarball}" >> "${GITHUB_ENV}"

      - name: R CMD check (Stan sampling tests opt out)
        env:
          ANTITRUSTBAYES_RUN_STAN_TESTS: "false"
        run: R CMD check --no-manual "${PACKAGE_TARBALL}"

      - name: Install built package for targeted smoke tests
        run: R CMD INSTALL --preclean "${PACKAGE_TARBALL}"

      - name: Run targeted Logit/CES Stan, pooling, and dispatch tests
        env:
          ANTITRUSTBAYES_RUN_STAN_TESTS: "true"
        run: |
          Rscript - <<'RSCRIPT'
          library(testthat)
          testthat::test_dir(
            file.path("tests", "testthat"),
            filter = "rho-studentt|s0-pooling|simulate-dispatch",
            reporter = "summary", package = "antitrustBayes",
            load_package = "installed"
          )
          RSCRIPT
